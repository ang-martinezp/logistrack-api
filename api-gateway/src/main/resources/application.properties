spring.application.name=api-gateway
server.port=8080

# Conexión con eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

#Ruta hacia el product-service

spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=lb://product-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/productos/**,/api/categorias/**,/api/unidades/**

#Ruta hacia inventory-service

spring.cloud.gateway.routes[1].id=inventory-service
spring.cloud.gateway.routes[1].uri=lb://inventory-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/stock/**,/api/movimientos/**,/api/alertas/**

#Ruta hacia order-service

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=lb://order-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/pedidos/**

#Ruta hacia dispatch-service

spring.cloud.gateway.routes[3].id=dispatch-service
spring.cloud.gateway.routes[3].uri=lb://dispatch-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/despachos/**

#Ruta a receiving-service

spring.cloud.gateway.routes[4].id=receiving-service
spring.cloud.gateway.routes[4].uri=lb://receiving-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/recepciones/**

#Ruta a supplier-service

spring.cloud.gateway.routes[5].id=supplier-service
spring.cloud.gateway.routes[5].uri=lb://supplier-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/proveedores/**

#Ruta a user-service

spring.cloud.gateway.routes[6].id=user-service
spring.cloud.gateway.routes[6].uri=lb://user-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/usuarios/**

#Ruta a auth-service

spring.cloud.gateway.routes[7].id=auth-service
spring.cloud.gateway.routes[7].uri=lb://auth-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/auth/**

#Ruta a notification-service

spring.cloud.gateway.routes[8].id=notification-service
spring.cloud.gateway.routes[8].uri=lb://notification-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/notificaciones/**

#Ruta a report-service

spring.cloud.gateway.routes[9].id=report-service
spring.cloud.gateway.routes[9].uri=lb://report-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/reportes/**



spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

